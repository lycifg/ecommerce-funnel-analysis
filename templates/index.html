<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电商用户行为漏斗分析看板</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e9eef3 100%);
            font-family: 'Segoe UI', Roboto, sans-serif;
            padding: 30px 20px;
        }
        .dashboard { max-width: 1300px; margin: 0 auto; }
        .card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            padding: 24px 28px;
            margin-bottom: 28px;
        }
        .header h1 { font-size: 28px; font-weight: 600; color: #1e293b; }
        .header p { color: #475569; margin-top: 8px; }
        .stats-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 28px;
        }
        .stat-card {
            flex: 1;
            min-width: 150px;
            background: #f8fafc;
            border-radius: 20px;
            padding: 18px 16px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        .stat-card .label { font-size: 14px; font-weight: 600; color: #3b82f6; text-transform: uppercase; }
        .stat-card .number { font-size: 36px; font-weight: 700; color: #0f172a; margin: 10px 0 5px; }
        .stat-card .sub { font-size: 13px; color: #64748b; }
        .rate-card { border-top: 4px solid #3b82f6; }
        .two-columns { display: flex; flex-wrap: wrap; gap: 28px; }
        .chart-container { flex: 2; min-width: 280px; }
        .insight-container {
            flex: 1;
            background: #fef9e3;
            border-radius: 24px;
            padding: 20px;
            border-left: 5px solid #f59e0b;
        }
        .insight-title { font-weight: 700; font-size: 18px; color: #b45309; margin-bottom: 16px; }
        .insight-text { font-size: 15px; line-height: 1.5; color: #1e293b; }
        .funnel-wrapper { width: 100%; height: 420px; }
        .footer-note { text-align: center; font-size: 13px; color: #94a3b8; margin-top: 16px; }
    </style>
</head>
<body>
<div class="dashboard">
    <div class="card header">
        <h1>📊 用户行为漏斗分析</h1>
        <p>浏览 → 加购 → 购买 · 转化率实时监控</p>
    </div>
    <div class="stats-row" id="statsCards">加载中...</div>
    <div class="two-columns">
        <div class="card chart-container">
            <div style="font-weight:600; margin-bottom:12px;">📉 转化漏斗 (人数)</div>
            <div id="funnelChart" class="funnel-wrapper"></div>
        </div>
        <div class="insight-container">
            <div class="insight-title">🧠 业务洞察</div>
            <div class="insight-text" id="insightText">计算中...</div>
        </div>
    </div>
    <div class="footer-note">⚡ 漏斗宽度代表人数规模 | 鼠标悬停查看具体数值</div>
</div>

<script>
    fetch('/funnel_data')
        .then(response => response.json())
        .then(data => {
            // 新后端格式：data.funnel 数组，每个元素有 stage 和 count
            const funnel = data.funnel;
            // 按顺序取出三个阶段的值
            const stages = funnel.map(item => item.stage);
            const counts = funnel.map(item => item.count);
            const view = counts[0];
            const cart = counts[1];
            const purchase = counts[2];
            const viewToCartRate = data.rates.view_to_cart;
            const cartToPurchaseRate = data.rates.cart_to_purchase;
            const overallRate = data.rates.overall;

            // 渲染指标卡片
            const statsHTML = `
                <div class="stat-card">
                    <div class="label">👀 ${stages[0]}人数</div>
                    <div class="number">${view}</div>
                    <div class="sub">用户-商品组合数</div>
                </div>
                <div class="stat-card">
                    <div class="label">🛒 ${stages[1]}人数</div>
                    <div class="number">${cart}</div>
                    <div class="sub">${viewToCartRate}% 转化</div>
                </div>
                <div class="stat-card">
                    <div class="label">✅ ${stages[2]}人数</div>
                    <div class="number">${purchase}</div>
                    <div class="sub">${cartToPurchaseRate}% 转化</div>
                </div>
                <div class="stat-card rate-card">
                    <div class="label">📈 整体转化率</div>
                    <div class="number">${overallRate}%</div>
                    <div class="sub">${stages[0]}→${stages[2]}</div>
                </div>
            `;
            document.getElementById('statsCards').innerHTML = statsHTML;

            // 简单洞察逻辑
            let insightMsg = "";
            if (viewToCartRate < 30) {
                insightMsg = "⚠️ 浏览→加购转化率偏低，建议优化商品详情页。";
            } else if (cartToPurchaseRate < 40) {
                insightMsg = "⚠️ 加购→购买流失严重，检查结算流程或增加优惠券。";
            } else {
                insightMsg = "✅ 转化率良好，可尝试提升客单价或复购。";
            }
            if (viewToCartRate < cartToPurchaseRate && viewToCartRate < 40) {
                insightMsg = `📉 核心瓶颈在「${stages[0]}→${stages[1]}」环节，流失了 ${(100 - viewToCartRate).toFixed(1)}% 的用户。`;
            } else if (cartToPurchaseRate < viewToCartRate && cartToPurchaseRate < 45) {
                insightMsg = `🛑 核心瓶颈在「${stages[1]}→${stages[2]}」环节，流失了 ${(100 - cartToPurchaseRate).toFixed(1)}% 的用户。`;
            }
            document.getElementById('insightText').innerHTML = insightMsg;

            // 绘制漏斗图
            const chartDom = document.getElementById('funnelChart');
            const myChart = echarts.init(chartDom);
            myChart.setOption({
                tooltip: { trigger: 'item', formatter: '{b}: {c} 人 ({d}%)' },
                series: [{
                    type: 'funnel',
                    data: funnel.map(item => ({ name: item.stage, value: item.count })),
                    sort: 'descending',
                    gap: 8,
                    label: { show: true, position: 'inside', formatter: '{b}: {d}%', fontSize: 13, color: '#fff' },
                    itemStyle: { borderColor: '#fff', borderWidth: 2, borderRadius: 12 },
                    color: ['#3b82f6', '#f59e0b', '#10b981']
                }]
            });
            window.addEventListener('resize', () => myChart.resize());
        })
        .catch(err => {
            console.error(err);
            document.getElementById('statsCards').innerHTML = '<div class="stat-card">❌ 数据加载失败，请检查后端</div>';
            document.getElementById('insightText').innerHTML = '后端服务异常，确保已运行 python app.py 并生成数据。';
        });
</script>
</body>
</html>
